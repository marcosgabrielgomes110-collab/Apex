[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "apex-flow"
version = "0.1.0"
description = "Zero-dependency Python workflow engine — DAG, @flow, @task, state"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "CodeMarcos"},
]
keywords = [
    "workflow",
    "dag",
    "task",
    "pipeline",
    "automation",
    "state-machine",
    "agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/marcosgabrielgomes110-collab/Apex"
Documentation = "https://github.com/marcosgabrielgomes110-collab/Apex"
Repository = "https://github.com/marcosgabrielgomes110-collab/Apex"
Issues = "https://github.com/marcosgabrielgomes110-collab/Apex/issues"

[tool.setuptools.packages.find]
include = ["apex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
